[project]
name = "omnicron-ui"
version = "0.1.0"
description = "PySide6 operator console for the Fairino welding robot."
readme = "README.md"
authors = [
    { name = "Sijan Khadka", email = "sijan.khadka08@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyorbbecsdk2>=2.1.1",
    "pyside6>=6.11.1",
]

[project.scripts]
omnicron-ui = "omnicron_ui.app:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The bundled Fairino SDK is third-party; don't lint it.
extend-exclude = ["fairino_sdk"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B904"]
